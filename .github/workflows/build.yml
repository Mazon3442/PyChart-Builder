name: Build executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest Ubuntu runner on purpose: the binary only runs on systems with
          # a glibc at least as new as the one it was built on.
          - os: ubuntu-22.04
            asset: gantt-builder-linux
          - os: windows-latest
            asset: gantt-builder-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        run: python build.py

      - name: Name the file for download
        shell: bash
        run: |
          if [ -f dist/gantt-builder.exe ]; then
            mv dist/gantt-builder.exe "dist/${{ matrix.asset }}"
          else
            mv dist/gantt-builder "dist/${{ matrix.asset }}"
          fi

      - name: Smoke test (renders the sample chart with the built binary)
        shell: bash
        run: |
          "./dist/${{ matrix.asset }}" deer_alarm.json --render
          test -s deer_alarm.png

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    # Pushing a tag like v1.0 publishes both binaries as a GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
